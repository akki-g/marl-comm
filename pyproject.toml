[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commstudy"
version = "0.2.0"
description = "Reproducible PCP and MAPDN communication comparisons"
requires-python = ">=3.11,<3.13"
dependencies = [
    "benchmarl[vmas]==1.5.2",
    "torch==2.13.0",
    "torchrl==0.11.1",
    "tensordict==0.11.0",
    "vmas==1.5.2",
    "numpy==2.2.6",
    "omegaconf>=2.3",
    "pandas==2.3.3",
    "pandapower==3.3.0",
    "gymnasium==1.3.0",
    "pettingzoo==1.27.0",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["commstudy*"]

[tool.setuptools.package-data]
"commstudy.environments.mapdn" = ["LICENSE", "ORIGIN.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
# Preserve upstream MAPDN style during the move; physics is checked by integration tests.
[tool.ruff.lint.per-file-ignores]
"src/commstudy/environments/mapdn/**/*.py" = ["E", "UP", "B"]
"src/commstudy/adapters/mapdn_parallel.py" = ["E501"]
