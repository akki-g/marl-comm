[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commstudy"
version = "0.1.0"
description = "Learned communication experiments for cooperative multi-agent reinforcement learning"
requires-python = ">=3.11"

dependencies = [
    "benchmarl[vmas]==1.5.2",
    "torchrl==0.11.0",
    "torch",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
