groups:
  adversary:              # predators — the group you actually care about training
    model_type: benchmarl_mlp
    params:
      num_cells: [128, 128]
      layer_class_path: torch.nn.Linear
      activation_class_path: torch.nn.Tanh
      activation_kwargs: null
      norm_class_path: null
      norm_kwargs: null
      num_feature_dims: 1

  agent:                  # prey — scripted, output discarded every step; keep tiny
    model_type: benchmarl_mlp
    params:
      num_cells: [8]
      layer_class_path: torch.nn.Linear
      activation_class_path: torch.nn.Tanh
      activation_kwargs: null
      norm_class_path: null
      norm_kwargs: null
      num_feature_dims: 1