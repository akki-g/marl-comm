# Selected V2 protocol, pending the all-seed MLP confirmation gate. Do not
# launch this ablation until the gate and the V2 main comparison justify it.
suite_id: simple_spread_comm_v2_stage4_graph_topology
run_namespace: v2
output_root: runs
algorithm: mappo
task: vmas_simple_spread
models: [comm_graph]
seeds: [0, 1, 2]
max_n_frames: 600000
overrides:
  experiment.gamma: 0.9
  algorithm_config.params.entropy_coef: 0.1
  experiment.on_policy_n_minibatch_iters: 5
  experiment.evaluation_interval: 12000
  experiment.checkpoint_interval: 120000
  experiment.checkpoint_at_end: true
  experiment.keep_checkpoints_num: 2

runs:
  - ablation: graph_topology
    ablation_value: full
    overrides:
      model_config.params.comm_kwargs.topology: full
  - ablation: graph_topology
    ablation_value: directed_ring
    overrides:
      model_config.params.comm_kwargs.topology: directed_ring
  - ablation: graph_topology
    ablation_value: erdos_renyi_p0.5_seed1_connected
    overrides:
      model_config.params.comm_kwargs.topology: erdos_renyi
      model_config.params.comm_kwargs.erdos_renyi_p: 0.5
      model_config.params.comm_kwargs.topology_seed: 1
