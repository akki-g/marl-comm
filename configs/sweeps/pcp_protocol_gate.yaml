# PCP protocol gate: fix gamma and entropy_coef on this task before any
# comparison row is spent.
#
# This replaces `pcp_identity_pilot` as the thing to run first. That pilot asked
# "is 60k or 120k enough frames?" and answered "neither, by about an order of
# magnitude" (docs/RESULTS_pcp_pilot.md §1), so budget is no longer the open
# question. Two other things are, and both were inherited untested:
#
#   gamma          `pcp_comm_main` carries Simple Spread's frozen 0.9. The prey
#                  is faster than the predators (max_speed 1.3 vs 1.0), so a
#                  one-predator chase never converges and a capture needs a
#                  pincer that takes far longer than 10 steps to set up. gamma
#                  0.9 discounts a reward 20 steps out to 0.12; 0.99 leaves it
#                  at 0.82. The pilot learned *because* an uncommitted edit
#                  meant it accidentally ran 0.99.
#   entropy_coef   The task is sparse -- 94% of random episodes score exactly
#                  zero -- so exploration matters. But the pilot also showed
#                  deterministic evaluation *underperforming* stochastic
#                  collection (2.0 vs 3.67 at 120k), and a large entropy bonus
#                  widens that gap. Both directions are real; measure it.
#
# 3x3 on the no-communication control, 3 seeds, 600k frames: 27 rows at roughly
# 40 min each on a V100, so ~18 GPU-hours. That is under a tenth of the main
# comparison it protects.
#
# Read the winner off `mean_final_return`, then freeze gamma and entropy_coef
# into every pcp_comm_* sweep and take the budget from where the winner's curve
# flattens -- the pilot's +1.75-per-100k slope had not flattened at 120k, so
# 600k is a floor here, not an estimate.
suite_id: pcp_protocol_gate
run_namespace: v2
output_root: runs

algorithm: mappo
task: vmas_predator_capture_prey
models:
  - pcp_comm_identity
seeds:
  - 0
  - 1
  - 2
max_n_frames: 600000
ablation: protocol

overrides:
  # PCP trains two BenchMARL groups, so its actor and critic are grouped
  # ensembles and the grouped critic must be selected explicitly. It belongs
  # here rather than in a top-level key: expand_suite_config emits only
  # algorithm/task/model/seed/max_n_frames plus this block, so a top-level
  # `critic_model:` would be dropped without a word.
  critic_model: pcp_critic
  # Five episodes put the standard error at 1.69 against effects of 1-3 return
  # points, because 94% of episodes score exactly zero. The evaluation env is
  # batched, so this widens the batch rather than adding rollouts: measured at
  # +24% evaluation wall-clock for 25x the samples, which takes the standard
  # error to 0.34. Do not lower it.
  experiment.evaluation_episodes: 128
  # 600k / 12k = 50 evaluation points, so the final-10% window averages 5 of
  # them rather than the pilot's 1.
  experiment.evaluation_interval: 12000
  experiment.checkpoint_interval: 120000
  experiment.checkpoint_at_end: true
  experiment.keep_checkpoints_num: 2
  experiment.on_policy_n_minibatch_iters: 10

runs:
  - ablation_value: g0.90_e0.00
    overrides: {experiment.gamma: 0.9,  algorithm_config.params.entropy_coef: 0.0}
  - ablation_value: g0.90_e0.01
    overrides: {experiment.gamma: 0.9,  algorithm_config.params.entropy_coef: 0.01}
  - ablation_value: g0.90_e0.10
    overrides: {experiment.gamma: 0.9,  algorithm_config.params.entropy_coef: 0.1}
  - ablation_value: g0.95_e0.00
    overrides: {experiment.gamma: 0.95, algorithm_config.params.entropy_coef: 0.0}
  - ablation_value: g0.95_e0.01
    overrides: {experiment.gamma: 0.95, algorithm_config.params.entropy_coef: 0.01}
  - ablation_value: g0.95_e0.10
    overrides: {experiment.gamma: 0.95, algorithm_config.params.entropy_coef: 0.1}
  - ablation_value: g0.99_e0.00
    overrides: {experiment.gamma: 0.99, algorithm_config.params.entropy_coef: 0.0}
  - ablation_value: g0.99_e0.01
    overrides: {experiment.gamma: 0.99, algorithm_config.params.entropy_coef: 0.01}
  - ablation_value: g0.99_e0.10
    overrides: {experiment.gamma: 0.99, algorithm_config.params.entropy_coef: 0.1}
