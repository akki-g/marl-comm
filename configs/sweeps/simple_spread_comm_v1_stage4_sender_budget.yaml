suite_id: simple_spread_comm_v1_stage4_sender_budget
output_root: runs
algorithm: mappo
task: vmas_simple_spread
seeds: [0, 1, 2]
max_n_frames: 600000
# Frozen common MAPPO protocol from the Identity calibration and confirmation.
overrides:
  experiment.gamma: 0.9
  algorithm_config.params.entropy_coef: 0.01
  experiment.on_policy_n_minibatch_iters: 10
  experiment.evaluation_interval: 12000
  experiment.checkpoint_interval: 120000
  experiment.checkpoint_at_end: true
  experiment.keep_checkpoints_num: 2

runs:
  - models: [comm_gated]
    ablation: sender_budget
    ablation_value: learned_k1
    overrides:
      model_config.params.comm_kwargs.sender_budget: 1
      model_config.params.comm_kwargs.sender_selection: learned
  - models: [comm_gated]
    ablation: sender_budget
    ablation_value: learned_k2
    overrides:
      model_config.params.comm_kwargs.sender_budget: 2
      model_config.params.comm_kwargs.sender_selection: learned
  - models: [comm_gated]
    ablation: sender_budget
    ablation_value: learned_k3
    overrides:
      model_config.params.comm_kwargs.sender_budget: 3
      model_config.params.comm_kwargs.sender_selection: learned
  - models: [comm_gated]
    ablation: sender_budget
    ablation_value: random_k1_seed0
    overrides:
      model_config.params.comm_kwargs.sender_budget: 1
      model_config.params.comm_kwargs.sender_selection: random
      model_config.params.comm_kwargs.sender_selection_seed: 0
  - models: [comm_gated]
    ablation: sender_budget
    ablation_value: random_k2_seed0
    overrides:
      model_config.params.comm_kwargs.sender_budget: 2
      model_config.params.comm_kwargs.sender_selection: random
      model_config.params.comm_kwargs.sender_selection_seed: 0
  - models: [comm_gated]
    ablation: sender_budget
    ablation_value: random_k3_seed0
    overrides:
      model_config.params.comm_kwargs.sender_budget: 3
      model_config.params.comm_kwargs.sender_selection: random
      model_config.params.comm_kwargs.sender_selection_seed: 0

  # AttentionComm calls learned scheduling "attention" internally. The
  # ablation label remains "learned" to distinguish it from random-K control.
  - models: [comm_attention]
    ablation: sender_budget
    ablation_value: learned_k1
    overrides:
      model_config.params.comm_kwargs.sender_budget: 1
      model_config.params.comm_kwargs.sender_selection: attention
  - models: [comm_attention]
    ablation: sender_budget
    ablation_value: learned_k2
    overrides:
      model_config.params.comm_kwargs.sender_budget: 2
      model_config.params.comm_kwargs.sender_selection: attention
  - models: [comm_attention]
    ablation: sender_budget
    ablation_value: learned_k3
    overrides:
      model_config.params.comm_kwargs.sender_budget: 3
      model_config.params.comm_kwargs.sender_selection: attention
  - models: [comm_attention]
    ablation: sender_budget
    ablation_value: random_k1_seed0
    overrides:
      model_config.params.comm_kwargs.sender_budget: 1
      model_config.params.comm_kwargs.sender_selection: random
      model_config.params.comm_kwargs.sender_selection_seed: 0
  - models: [comm_attention]
    ablation: sender_budget
    ablation_value: random_k2_seed0
    overrides:
      model_config.params.comm_kwargs.sender_budget: 2
      model_config.params.comm_kwargs.sender_selection: random
      model_config.params.comm_kwargs.sender_selection_seed: 0
  - models: [comm_attention]
    ablation: sender_budget
    ablation_value: random_k3_seed0
    overrides:
      model_config.params.comm_kwargs.sender_budget: 3
      model_config.params.comm_kwargs.sender_selection: random
      model_config.params.comm_kwargs.sender_selection_seed: 0
