suite_id: simple_spread_comm_v1_stage2_message_dim
output_root: runs
algorithm: mappo
task: vmas_simple_spread
models:
  - comm_broadcast
  - comm_gated
  - comm_attention
  - comm_graph
seeds: [0, 1, 2]
max_n_frames: 600000
# Frozen common MAPPO protocol from the Identity calibration and confirmation.
overrides:
  experiment.gamma: 0.9
  algorithm_config.params.entropy_coef: 0.01
  experiment.on_policy_n_minibatch_iters: 10
  experiment.evaluation_interval: 12000
  experiment.checkpoint_interval: 120000
  experiment.checkpoint_at_end: true
  experiment.keep_checkpoints_num: 2

runs:
  - ablation: message_dim
    ablation_value: 8
    overrides:
      model_config.params.comm_kwargs.message_dim: 8
  - ablation: message_dim
    ablation_value: 16
    overrides:
      model_config.params.comm_kwargs.message_dim: 16
  - ablation: message_dim
    ablation_value: 32
    overrides:
      model_config.params.comm_kwargs.message_dim: 32
  - ablation: message_dim
    ablation_value: 64
    overrides:
      model_config.params.comm_kwargs.message_dim: 64
