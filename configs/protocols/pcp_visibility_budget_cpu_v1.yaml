schema_version: 1
protocol_id: pcp_visibility_budget_cpu_v1
status: candidate
description: Controlled radius1/global prey visibility and zero/full Broadcast budget,
  with active local capacity and Identity controls; five matched training seeds, fixed600k
  CPU budget.
base_spec:
  algorithm: mappo
  task: vmas_predator_capture_prey
  model: pcp_comm_identity
  seed: 0
  algorithm_config:
    params:
      share_param_critic: true
      clip_epsilon: 0.2
      entropy_coef: 0.1
      critic_coef: 1.0
      loss_critic_type: l2
      lmbda: 0.9
      scale_mapping: biased_softplus_1.0
      use_tanh_normal: true
      minibatch_advantage: false
  task_config:
    params:
      max_steps: 100
      num_good_agents: 1
      num_adversaries: 3
      num_landmarks: 2
      shape_agent_rew: false
      shape_adversary_rew: false
      agents_share_rew: false
      adversaries_share_rew: true
      observe_same_team: true
      observe_pos: true
      observe_vel: true
      bound: 1.0
      respawn_at_catch: false
      prey_detection_radius: 0.8
      prey_obstacle_margin: 0.4
      prey_boundary_margin: 0.3
      prey_wander_force: 0.15
      prey_noise_std: 0.05
      prey_min_flee_frac: 0.3
      predator_sensing_radius: 1.0
    return_groups:
    - adversary
  model_config:
    groups:
      adversary:
        model_type: communication
        params:
          hidden_dim: 128
          num_encoder_layers: 2
          activation_class_path: torch.nn.Tanh
          actor_observation_keys:
          - observation
          comm_class_path: commstudy.communication.identity.IdentityComm
          comm_kwargs:
            grad_clip: null
            normalize_comm_path: false
          comm_context_keys: {}
          use_role_embedding: false
          num_roles: 2
      agent:
        model_type: benchmarl_mlp
        params:
          num_cells:
          - 8
          activation_kwargs: null
          norm_kwargs: null
          num_feature_dims: 1
          activation_class_path: torch.nn.Tanh
          norm_class_path: null
          layer_class_path: torch.nn.Linear
  critic_model:
    groups:
      adversary:
        model_type: benchmarl_mlp
        params:
          num_cells:
          - 128
          - 128
          activation_kwargs: null
          norm_kwargs: null
          num_feature_dims: 1
          activation_class_path: torch.nn.Tanh
          norm_class_path: null
          layer_class_path: torch.nn.Linear
      agent:
        model_type: benchmarl_mlp
        params:
          num_cells:
          - 8
          activation_kwargs: null
          norm_kwargs: null
          num_feature_dims: 1
          activation_class_path: torch.nn.Tanh
          norm_class_path: null
          layer_class_path: torch.nn.Linear
  experiment:
    sampling_device: cpu
    train_device: cpu
    buffer_device: cpu
    share_policy_params: true
    prefer_continuous_actions: true
    collect_with_grad: false
    parallel_collection: false
    gamma: 0.95
    lr: 5.0e-05
    adam_eps: 1.0e-06
    adam_extra_kwargs: {}
    clip_grad_norm: true
    clip_grad_val: 5
    soft_target_update: true
    polyak_tau: 0.005
    hard_target_update_frequency: 5
    exploration_eps_init: 0.8
    exploration_eps_end: 0.01
    exploration_anneal_frames: null
    max_n_iters: null
    max_n_frames: 600000
    on_policy_collected_frames_per_batch: 6000
    on_policy_n_envs_per_worker: 10
    on_policy_n_minibatch_iters: 10
    on_policy_minibatch_size: 400
    off_policy_collected_frames_per_batch: 6000
    off_policy_n_envs_per_worker: 10
    off_policy_n_optimizer_steps: 1000
    off_policy_train_batch_size: 128
    off_policy_memory_size: 1000000
    off_policy_init_random_frames: 0
    off_policy_use_prioritized_replay_buffer: false
    off_policy_prb_alpha: 0.6
    off_policy_prb_beta: 0.4
    evaluation: true
    render: false
    evaluation_interval: 12000
    evaluation_episodes: 128
    evaluation_deterministic_actions: true
    evaluation_static: false
    loggers:
    - csv
    project_name: commstudy
    wandb_extra_kwargs: {}
    create_json: true
    save_folder: null
    restore_file: null
    restore_map_location: null
    checkpoint_interval: 120000
    checkpoint_at_end: true
    keep_checkpoints_num: null
    exclude_buffer_from_checkpoint: false
methods:
  pcp_comm_identity:
    groups:
      adversary:
        model_type: communication
        params:
          hidden_dim: 128
          num_encoder_layers: 2
          activation_class_path: torch.nn.Tanh
          actor_observation_keys:
          - observation
          comm_class_path: commstudy.communication.identity.IdentityComm
          comm_kwargs:
            grad_clip: null
            normalize_comm_path: false
          comm_context_keys: {}
          use_role_embedding: false
          num_roles: 2
      agent:
        model_type: benchmarl_mlp
        params:
          num_cells:
          - 8
          activation_kwargs: null
          norm_kwargs: null
          num_feature_dims: 1
          activation_class_path: torch.nn.Tanh
          norm_class_path: null
          layer_class_path: torch.nn.Linear
  pcp_local_capacity:
    groups:
      adversary:
        model_type: communication
        params:
          hidden_dim: 128
          num_encoder_layers: 2
          activation_class_path: torch.nn.Tanh
          actor_observation_keys:
          - observation
          comm_class_path: commstudy.communication.local_control.LocalCapacityComm
          comm_kwargs:
            grad_clip: null
            normalize_comm_path: false
            message_dim: 32
          comm_context_keys: {}
          use_role_embedding: false
          num_roles: 2
      agent:
        model_type: benchmarl_mlp
        params:
          num_cells:
          - 8
          activation_kwargs: null
          norm_kwargs: null
          num_feature_dims: 1
          activation_class_path: torch.nn.Tanh
          norm_class_path: null
          layer_class_path: torch.nn.Linear
  pcp_broadcast_k0:
    groups:
      adversary:
        model_type: communication
        params:
          hidden_dim: 128
          num_encoder_layers: 2
          activation_class_path: torch.nn.Tanh
          actor_observation_keys:
          - observation
          comm_class_path: commstudy.communication.budgeted_broadcast.BudgetedBroadcastComm
          comm_kwargs:
            grad_clip: null
            normalize_comm_path: false
            message_dim: 32
            exclude_self: true
            residual: true
            channel:
              type: identity
              mode: always
            sender_budget: 0
          comm_context_keys:
            mask: comm_mask
            sender_mask: comm_sender_mask
          use_role_embedding: false
          num_roles: 2
      agent:
        model_type: benchmarl_mlp
        params:
          num_cells:
          - 8
          activation_kwargs: null
          norm_kwargs: null
          num_feature_dims: 1
          activation_class_path: torch.nn.Tanh
          norm_class_path: null
          layer_class_path: torch.nn.Linear
  pcp_broadcast_k3:
    groups:
      adversary:
        model_type: communication
        params:
          hidden_dim: 128
          num_encoder_layers: 2
          activation_class_path: torch.nn.Tanh
          actor_observation_keys:
          - observation
          comm_class_path: commstudy.communication.budgeted_broadcast.BudgetedBroadcastComm
          comm_kwargs:
            grad_clip: null
            normalize_comm_path: false
            message_dim: 32
            exclude_self: true
            residual: true
            channel:
              type: identity
              mode: always
            sender_budget: 3
          comm_context_keys:
            mask: comm_mask
            sender_mask: comm_sender_mask
          use_role_embedding: false
          num_roles: 2
      agent:
        model_type: benchmarl_mlp
        params:
          num_cells:
          - 8
          activation_kwargs: null
          norm_kwargs: null
          num_feature_dims: 1
          activation_class_path: torch.nn.Tanh
          norm_class_path: null
          layer_class_path: torch.nn.Linear
factors:
  visibility:
    models:
    - pcp_comm_identity
    - pcp_local_capacity
    - pcp_broadcast_k0
    - pcp_broadcast_k3
    values:
      radius1:
        pcp_comm_identity:
          task_config.params.predator_sensing_radius: 1.0
        pcp_local_capacity:
          task_config.params.predator_sensing_radius: 1.0
        pcp_broadcast_k0:
          task_config.params.predator_sensing_radius: 1.0
        pcp_broadcast_k3:
          task_config.params.predator_sensing_radius: 1.0
      global:
        pcp_comm_identity:
          task_config.params.predator_sensing_radius: null
        pcp_local_capacity:
          task_config.params.predator_sensing_radius: null
        pcp_broadcast_k0:
          task_config.params.predator_sensing_radius: null
        pcp_broadcast_k3:
          task_config.params.predator_sensing_radius: null
    requires_evidence: []
runtime:
  device: cpu
  threads: 1
  python: 3.12.13
  packages:
    benchmarl: 1.5.2
    torch: 2.13.0
    torchrl: 0.11.1
    tensordict: 0.11.0
    vmas: 1.5.2
contracts:
  randomness_protocol: pcp_rng_v2
  observation_protocol: pcp_visibility_v2
  critic_state_protocol: pcp_physical_state_v1
  evaluation_randomness_protocol: evaluation_rng_v2
  channel_randomness_protocol: channel_rng_v2
  training_health_protocol: training_health_v1
  domain_metrics_protocol: pcp_transition_metrics_v1
  time_limit_protocol: pcp_time_limit_v1
  reward_protocol: simple_tag_repeated_contact_v1
  training_groups:
  - adversary
  - agent
  measured_groups:
  - adversary
  prey_policy: discarded_by_script_but_still_optimized
selection:
  criterion: heldout_contact_by_step50_probability_and_paired_capacity_control_contrast
  budget_claim: fixed_compute_600000_frames_not_convergence
  confirmation_seeds:
  - 10
  - 11
  comparison_seeds:
  - 20
  - 21
  - 22
  - 23
  - 24
  ablation_seeds:
  - 20
  - 21
  - 22
  comparison_requires: typed promotion certificate, complete retention confirmation,
    additive-source Identity bridge, all eight final-source runtime/optimization smokes,
    reviewed immutable D4 design
  ablation_requires: not part of this bounded comparison
evidence:
- path: docs/PCP_CONFIRMATION_RETENTION_PLAN.md
  role: promotion_dependency
- path: docs/PCP_VISIBILITY_BUDGET_PLAN.md
  role: prespecified_controlled_comparison
launch_scope:
  comparison:
  - model: pcp_comm_identity
    ablation: visibility
    ablation_value: radius1
  - model: pcp_local_capacity
    ablation: visibility
    ablation_value: radius1
  - model: pcp_broadcast_k0
    ablation: visibility
    ablation_value: radius1
  - model: pcp_broadcast_k3
    ablation: visibility
    ablation_value: radius1
  - model: pcp_comm_identity
    ablation: visibility
    ablation_value: global
  - model: pcp_local_capacity
    ablation: visibility
    ablation_value: global
  - model: pcp_broadcast_k0
    ablation: visibility
    ablation_value: global
  - model: pcp_broadcast_k3
    ablation: visibility
    ablation_value: global
