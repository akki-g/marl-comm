schema_version: 1
protocol_id: mapdn_mechanisms_v1
status: requires_new_suite_qualification
base_spec:
  algorithm: mappo
  task: mapdn_voltage_control
  model: comm_identity
  seed: 1100
  algorithm_config:
    params:
      share_param_critic: true
      clip_epsilon: 0.2
      entropy_coef: 0.0
      critic_coef: 1.0
      loss_critic_type: l2
      lmbda: 0.9
      scale_mapping: biased_softplus_1.0
      use_tanh_normal: true
      minibatch_advantage: false
  task_config:
    params:
      data_path: data/case33_3min_final
      manifest_path: data/mapdn_case33_manifest.json
      normalization_path: null
      max_steps: 239
      history: 1
      split: train
      evaluation_split: validation
      measurement_noise: false
      reset_action: false
      mode: distributed
      voltage_barrier_type: l1
      voltage_weight: 1.0
      q_weight: 0.1
      line_weight: null
      pv_scale: 1.0
      demand_scale: 1.0
      v_lower: 0.95
      v_upper: 1.05
      action_scale: 0.8
      action_bias: 0.0
      state_space:
      - pv
      - demand
      - reactive
      - vm_pu
      - va_degree
      solver_algorithm: nr
      solver_max_iteration: 20
      solver_tolerance_mva: 1.0e-08
    return_groups:
    - agents
  model_config:
    model_type: communication
    params:
      hidden_dim: 128
      num_encoder_layers: 2
      activation_class_path: torch.nn.Tanh
      actor_observation_keys:
      - observation
      comm_class_path: commstudy.communication.identity.IdentityComm
      comm_kwargs:
        grad_clip: null
        normalize_comm_path: false
      comm_context_keys: {}
      use_role_embedding: false
      num_roles: 2
  critic_model:
    model_type: benchmarl_mlp
    params:
      num_cells:
      - 128
      - 128
      activation_kwargs: null
      norm_kwargs: null
      num_feature_dims: 1
      activation_class_path: torch.nn.Tanh
      norm_class_path: null
      layer_class_path: torch.nn.Linear
  experiment:
    sampling_device: cpu
    train_device: cpu
    buffer_device: cpu
    share_policy_params: true
    prefer_continuous_actions: true
    collect_with_grad: false
    parallel_collection: false
    gamma: 0.99
    lr: 5.0e-05
    adam_eps: 1.0e-06
    adam_extra_kwargs: {}
    clip_grad_norm: true
    clip_grad_val: 5.0
    soft_target_update: true
    polyak_tau: 0.005
    hard_target_update_frequency: 5
    exploration_eps_init: 0.8
    exploration_eps_end: 0.01
    exploration_anneal_frames: null
    max_n_iters: null
    max_n_frames: 131072
    on_policy_collected_frames_per_batch: 256
    on_policy_n_envs_per_worker: 1
    on_policy_n_minibatch_iters: 4
    on_policy_minibatch_size: 64
    off_policy_collected_frames_per_batch: 6000
    off_policy_n_envs_per_worker: 10
    off_policy_n_optimizer_steps: 1000
    off_policy_train_batch_size: 128
    off_policy_memory_size: 1000000
    off_policy_init_random_frames: 0
    off_policy_use_prioritized_replay_buffer: false
    off_policy_prb_alpha: 0.6
    off_policy_prb_beta: 0.4
    evaluation: false
    render: false
    evaluation_interval: 8192
    evaluation_episodes: 16
    evaluation_deterministic_actions: true
    evaluation_static: true
    loggers:
    - csv
    project_name: commstudy
    wandb_extra_kwargs: {}
    create_json: true
    save_folder: null
    restore_file: null
    restore_map_location: null
    checkpoint_interval: 32768
    checkpoint_at_end: true
    keep_checkpoints_num: null
    exclude_buffer_from_checkpoint: false
methods:
  identity:
    model_type: communication
    params:
      hidden_dim: 128
      num_encoder_layers: 2
      activation_class_path: torch.nn.Tanh
      actor_observation_keys:
      - observation
      comm_class_path: commstudy.communication.identity.IdentityComm
      comm_kwargs:
        grad_clip: null
        normalize_comm_path: false
      comm_context_keys: {}
      use_role_embedding: false
      num_roles: 2
  broadcast:
    model_type: communication
    params:
      hidden_dim: 128
      num_encoder_layers: 2
      activation_class_path: torch.nn.Tanh
      actor_observation_keys:
      - observation
      comm_class_path: commstudy.communication.broadcast.BroadcastComm
      comm_kwargs:
        grad_clip: null
        normalize_comm_path: false
        message_dim: 32
        exclude_self: true
        residual: true
        channel:
          type: identity
          mode: always
      comm_context_keys:
        mask: comm_mask
        sender_mask: comm_sender_mask
      use_role_embedding: false
      num_roles: 2
  gated:
    model_type: communication
    params:
      hidden_dim: 128
      num_encoder_layers: 2
      activation_class_path: torch.nn.Tanh
      actor_observation_keys:
      - observation
      comm_class_path: commstudy.communication.gated.GatedComm
      comm_kwargs:
        grad_clip: null
        normalize_comm_path: false
        message_dim: 32
        exclude_self: true
        residual: true
        hard: false
        gate_threshold: 0.5
        sender_budget: null
        sender_selection: learned
        sender_selection_seed: 0
        channel:
          type: identity
          mode: always
      comm_context_keys:
        mask: comm_mask
        sender_mask: comm_sender_mask
      use_role_embedding: false
      num_roles: 2
  attention:
    model_type: communication
    params:
      hidden_dim: 128
      num_encoder_layers: 2
      activation_class_path: torch.nn.Tanh
      actor_observation_keys:
      - observation
      comm_class_path: commstudy.communication.attention.AttentionComm
      comm_kwargs:
        grad_clip: null
        normalize_comm_path: false
        message_dim: 32
        key_dim: 32
        num_heads: 4
        rounds: 1
        temperature: 1.0
        exclude_self: true
        residual: true
        channel:
          type: identity
          mode: always
        sender_budget: null
        sender_selection: attention
        sender_selection_seed: 0
        store_debug_attention: false
        role_aware: false
        num_roles: 2
      comm_context_keys:
        mask: comm_mask
        sender_mask: comm_sender_mask
      use_role_embedding: false
      num_roles: 2
  graph_full:
    model_type: communication
    params:
      hidden_dim: 128
      num_encoder_layers: 2
      activation_class_path: torch.nn.Tanh
      actor_observation_keys:
      - observation
      comm_class_path: commstudy.communication.graph.GraphComm
      comm_kwargs:
        grad_clip: null
        normalize_comm_path: false
        message_dim: 32
        key_dim: 32
        num_heads: 4
        rounds: 1
        temperature: 1.0
        negative_slope: 0.2
        exclude_self: true
        residual: true
        topology: full
        erdos_renyi_p: 0.5
        topology_seed: 0
        erdos_renyi_directed: false
        channel:
          type: identity
          mode: always
        sender_budget: null
        sender_selection: attention
        sender_selection_seed: 0
        store_debug_attention: false
        num_roles: 2
        role_aware: false
      comm_context_keys:
        mask: comm_mask
        sender_mask: comm_sender_mask
      use_role_embedding: false
      num_roles: 2
  local_capacity:
    model_type: communication
    params:
      hidden_dim: 128
      num_encoder_layers: 2
      activation_class_path: torch.nn.Tanh
      actor_observation_keys:
      - observation
      comm_class_path: commstudy.communication.local_control.LocalCapacityComm
      comm_kwargs:
        message_dim: 32
        grad_clip: null
        normalize_comm_path: false
      comm_context_keys: {}
      use_role_embedding: false
      num_roles: 2
