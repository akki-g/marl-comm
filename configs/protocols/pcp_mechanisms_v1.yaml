schema_version: 1
protocol_id: pcp_mechanisms_v1
status: requires_new_suite_qualification
base_spec:
  algorithm: mappo
  task: vmas_predator_capture_prey
  model: pcp_comm_identity
  seed: 0
  algorithm_config:
    params:
      share_param_critic: true
      clip_epsilon: 0.2
      entropy_coef: 0.1
      critic_coef: 1.0
      loss_critic_type: l2
      lmbda: 0.9
      scale_mapping: biased_softplus_1.0
      use_tanh_normal: true
      minibatch_advantage: false
  task_config:
    params:
      max_steps: 100
      num_good_agents: 1
      num_adversaries: 3
      num_landmarks: 2
      shape_agent_rew: false
      shape_adversary_rew: false
      agents_share_rew: false
      adversaries_share_rew: true
      observe_same_team: true
      observe_pos: true
      observe_vel: true
      bound: 1.0
      respawn_at_catch: false
      prey_detection_radius: 0.8
      prey_obstacle_margin: 0.4
      prey_boundary_margin: 0.3
      prey_wander_force: 0.15
      prey_noise_std: 0.05
      prey_min_flee_frac: 0.3
      predator_sensing_radius: 1.0
    return_groups:
    - adversary
  model_config:
    groups:
      adversary:
        model_type: communication
        params:
          hidden_dim: 128
          num_encoder_layers: 2
          activation_class_path: torch.nn.Tanh
          actor_observation_keys:
          - observation
          comm_class_path: commstudy.communication.identity.IdentityComm
          comm_kwargs:
            grad_clip: null
            normalize_comm_path: false
          comm_context_keys: {}
          use_role_embedding: false
          num_roles: 2
      agent:
        model_type: benchmarl_mlp
        params:
          num_cells:
          - 8
          activation_kwargs: null
          norm_kwargs: null
          num_feature_dims: 1
          activation_class_path: torch.nn.Tanh
          norm_class_path: null
          layer_class_path: torch.nn.Linear
  critic_model:
    groups:
      adversary:
        model_type: benchmarl_mlp
        params:
          num_cells:
          - 128
          - 128
          activation_kwargs: null
          norm_kwargs: null
          num_feature_dims: 1
          activation_class_path: torch.nn.Tanh
          norm_class_path: null
          layer_class_path: torch.nn.Linear
      agent:
        model_type: benchmarl_mlp
        params:
          num_cells:
          - 8
          activation_kwargs: null
          norm_kwargs: null
          num_feature_dims: 1
          activation_class_path: torch.nn.Tanh
          norm_class_path: null
          layer_class_path: torch.nn.Linear
  experiment:
    sampling_device: cpu
    train_device: cpu
    buffer_device: cpu
    share_policy_params: true
    prefer_continuous_actions: true
    collect_with_grad: false
    parallel_collection: false
    gamma: 0.95
    lr: 5.0e-05
    adam_eps: 1.0e-06
    adam_extra_kwargs: {}
    clip_grad_norm: true
    clip_grad_val: 5
    soft_target_update: true
    polyak_tau: 0.005
    hard_target_update_frequency: 5
    exploration_eps_init: 0.8
    exploration_eps_end: 0.01
    exploration_anneal_frames: null
    max_n_iters: null
    max_n_frames: 600000
    on_policy_collected_frames_per_batch: 6000
    on_policy_n_envs_per_worker: 10
    on_policy_n_minibatch_iters: 10
    on_policy_minibatch_size: 400
    off_policy_collected_frames_per_batch: 6000
    off_policy_n_envs_per_worker: 10
    off_policy_n_optimizer_steps: 1000
    off_policy_train_batch_size: 128
    off_policy_memory_size: 1000000
    off_policy_init_random_frames: 0
    off_policy_use_prioritized_replay_buffer: false
    off_policy_prb_alpha: 0.6
    off_policy_prb_beta: 0.4
    evaluation: true
    render: false
    evaluation_interval: 12000
    evaluation_episodes: 128
    evaluation_deterministic_actions: true
    evaluation_static: false
    loggers:
    - csv
    project_name: commstudy
    wandb_extra_kwargs: {}
    create_json: true
    save_folder: null
    restore_file: null
    restore_map_location: null
    checkpoint_interval: 120000
    checkpoint_at_end: true
    keep_checkpoints_num: null
    exclude_buffer_from_checkpoint: false
